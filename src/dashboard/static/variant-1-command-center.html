<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariadne — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
/* ═══════════════════ RESET ═══════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ═══════════════════ CUSTOM PROPERTIES ═══════════════════ */
:root {
    --bg: #070B14;
    --surface: #0E1521;
    --elevated: #131C2E;
    --border: rgba(255,255,255,0.07);
    --border-accent: rgba(59,130,246,0.3);
    --text: #E2E8F0;
    --text-2: #94A3B8;
    --text-3: #475569;
    --blue: #3B82F6;
    --green: #10B981;
    --red: #EF4444;
    --amber: #F59E0B;
    --purple: #A78BFA;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Fira Code', 'Consolas', monospace;
    --radius: 8px;
    --radius-sm: 5px;
    --transition: 180ms ease;
}

/* ═══════════════════ BASE ═══════════════════ */
html { scroll-behavior: smooth; }
html, body { width: 100%; min-height: 100%; }
body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ═══════════════════ SCROLLBAR ═══════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-2); }

/* ═══════════════════ HEADER ═══════════════════ */
.header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 1.25rem;
    padding: 0 1.5rem;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}
.logo {
    font-family: var(--font-mono);
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--blue);
    letter-spacing: -0.02em;
    user-select: none;
    white-space: nowrap;
}
.header-sub {
    font-family: var(--font-sans);
    font-size: 0.625rem;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-left: -0.5rem;
    white-space: nowrap;
}
.header-spacer { flex: 1; }
.nav-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 3px;
}
.nav-tab {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.35rem 0.85rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-3);
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: color var(--transition), background var(--transition);
    white-space: nowrap;
    font-family: var(--font-sans);
}
.nav-tab:hover { color: var(--text-2); }
.nav-tab.active {
    color: var(--text);
    background: var(--elevated);
}
.nav-tab-path {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-3);
    opacity: 0.7;
}
.header-version {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-3);
    padding: 0.2rem 0.5rem;
    background: var(--bg);
    border-radius: var(--radius-sm);
    white-space: nowrap;
}

/* ═══════════════════ LAYOUT ═══════════════════ */
.main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

/* ═══════════════════ LOADING SPINNER ═══════════════════ */
.spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-state {
    display: flex; align-items: center; justify-content: center;
    gap: 0.6rem;
    padding: 2rem;
    color: var(--text-3);
    font-size: 0.8rem;
}

/* ═══════════════════ SECTION TITLES ═══════════════════ */
.section-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
}
.section-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
}
.section-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
    background: rgba(59,130,246,0.12);
    color: var(--blue);
}
.section-badge--red {
    background: rgba(239,68,68,0.12);
    color: var(--red);
}

/* ═══════════════════ STATS HERO ROW ═══════════════════ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.75rem;
}
.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    transition: border-color var(--transition), transform var(--transition);
}
.stat-card:hover {
    border-color: var(--border-accent);
    transform: translateY(-1px);
}
.stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 0.4rem;
}
.stat-label svg {
    width: 14px; height: 14px;
    opacity: 0.5;
}
.stat-value {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
}
.stat-value--red { color: var(--red); }
.stat-value--green { color: var(--green); }
.stat-sub {
    font-size: 0.7rem;
    color: var(--text-3);
}
.stat-sub--red { color: rgba(239,68,68,0.7); }
.progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    margin-top: 0.25rem;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--blue);
    width: 0%;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
}
.languages-list {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-2);
    line-height: 1.6;
    word-break: break-word;
}

/* ═══════════════════ INSIGHTS TRIPTYCH ═══════════════════ */
.insights-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
}
.insight-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    min-height: 220px;
    max-height: 400px;
    overflow: hidden;
}
.insight-panel__list {
    flex: 1;
    overflow-y: auto;
    margin-top: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 1px;
}
.insight-row {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.45rem 0.5rem;
    border-radius: var(--radius-sm);
    transition: background var(--transition);
    cursor: default;
}
.insight-row:hover { background: var(--elevated); }
.insight-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
}
.insight-dot--function { background: var(--blue); }
.insight-dot--class { background: var(--purple); }
.insight-dot--method { background: var(--green); }
.insight-dot--interface { background: var(--amber); }
.insight-dot--other { background: var(--text-3); }
.insight-dot--amber { background: var(--amber); }
.insight-name {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
}
.insight-file {
    font-size: 0.65rem;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
}
.insight-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 500;
    padding: 0.1rem 0.45rem;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
}
.insight-badge--blue {
    background: rgba(59,130,246,0.12);
    color: var(--blue);
}
.insight-badge--amber {
    background: rgba(245,158,11,0.12);
    color: var(--amber);
}
.insight-chain {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.5rem;
    border-left: 2px solid var(--red);
    margin-left: 0.25rem;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    transition: background var(--transition);
}
.insight-chain:hover { background: var(--elevated); }
.insight-chain__node {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text);
}
.insight-chain__arrow {
    font-size: 0.7rem;
    color: var(--red);
    opacity: 0.6;
}
.insight-empty {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.5rem;
    font-size: 0.8rem;
    color: var(--green);
}
.insight-empty svg { width: 16px; height: 16px; color: var(--green); }

/* ═══════════════════ GRAPH EXPLORER ═══════════════════ */
.graph-section { display: flex; flex-direction: column; }
.graph-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1rem;
    font-size: 0.78rem;
    font-weight: 500;
    font-family: var(--font-sans);
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: color var(--transition), border-color var(--transition), background var(--transition);
    align-self: flex-start;
}
.graph-toggle-btn:hover {
    color: var(--text);
    border-color: var(--border-accent);
    background: var(--elevated);
}
.graph-toggle-btn svg {
    width: 14px; height: 14px;
    transition: transform var(--transition);
}
.graph-toggle-btn.expanded svg { transform: rotate(180deg); }

.graph-container {
    display: none;
    margin-top: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
}
.graph-container.visible { display: block; }
.graph-canvas-wrap {
    width: 100%;
    height: 500px;
    position: relative;
}
.graph-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
}
.graph-tooltip {
    position: absolute;
    pointer-events: none;
    padding: 0.5rem 0.7rem;
    background: rgba(7,11,20,0.92);
    border: 1px solid var(--border-accent);
    border-radius: var(--radius-sm);
    font-size: 0.72rem;
    color: var(--text);
    white-space: nowrap;
    display: none;
    z-index: 10;
    backdrop-filter: blur(8px);
}
.graph-tooltip-name {
    font-family: var(--font-mono);
    font-weight: 500;
    margin-bottom: 0.2rem;
}
.graph-tooltip-meta {
    color: var(--text-3);
    font-size: 0.65rem;
}
.graph-legend {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
}
.graph-legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--text-3);
}
.graph-legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
}

/* ═══════════════════ DEAD CODE TABLE ═══════════════════ */
.dead-code-section { display: flex; flex-direction: column; }
.dead-search-wrap {
    position: relative;
    max-width: 320px;
    margin-bottom: 0.75rem;
}
.dead-search {
    width: 100%;
    padding: 0.5rem 0.75rem 0.5rem 2.2rem;
    font-size: 0.78rem;
    font-family: var(--font-sans);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--transition);
}
.dead-search:focus { border-color: var(--border-accent); }
.dead-search::placeholder { color: var(--text-3); }
.dead-search-icon {
    position: absolute;
    left: 0.7rem; top: 50%; transform: translateY(-50%);
    color: var(--text-3);
    pointer-events: none;
}
.dead-search-icon svg { width: 14px; height: 14px; }

.dead-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}
.dead-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
}
.dead-table th {
    text-align: left;
    padding: 0.6rem 1rem;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color var(--transition);
}
.dead-table th:hover { color: var(--text-2); }
.dead-table th .sort-arrow {
    display: inline-block;
    margin-left: 0.3rem;
    font-size: 0.6rem;
    opacity: 0.4;
}
.dead-table th.sorted .sort-arrow { opacity: 1; color: var(--blue); }
.dead-table td {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
}
.dead-table tr:last-child td { border-bottom: none; }
.dead-table tr {
    transition: background var(--transition);
}
.dead-table tbody tr:hover { background: var(--elevated); }
.dead-name {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text);
}
.dead-file {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-2);
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.dead-line {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-3);
}
.kind-badge {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
    white-space: nowrap;
}
.kind-badge--function { background: rgba(59,130,246,0.12); color: var(--blue); }
.kind-badge--class { background: rgba(167,139,250,0.12); color: var(--purple); }
.kind-badge--method { background: rgba(16,185,129,0.12); color: var(--green); }
.kind-badge--interface { background: rgba(245,158,11,0.12); color: var(--amber); }
.kind-badge--other { background: rgba(71,85,105,0.2); color: var(--text-3); }

.dead-empty {
    padding: 2rem;
    text-align: center;
    color: var(--text-3);
    font-size: 0.8rem;
}

.dead-table-scroll {
    max-height: 480px;
    overflow-y: auto;
}

/* ═══════════════════ ERROR STATE ═══════════════════ */
.error-state {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 1rem;
    color: var(--red);
    font-size: 0.8rem;
}
.error-state svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ═══════════════════ RESPONSIVE ═══════════════════ */
@media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .insights-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .header { gap: 0.75rem; padding: 0 1rem; }
    .nav-tabs { display: none; }
    .main { padding: 1rem; }
}
    </style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="header">
    <span class="logo">ariadne</span>
    <span class="header-sub">Command Center</span>
    <div class="header-spacer"></div>
    <nav class="nav-tabs">
        <a href="/" class="nav-tab active">
            <span class="nav-tab-path">/</span> Command Center
        </a>
        <a href="/v2" class="nav-tab">
            <span class="nav-tab-path">/v2</span> Navigator
        </a>
        <a href="/v3" class="nav-tab">
            <span class="nav-tab-path">/v3</span> Audit Report
        </a>
    </nav>
    <span class="header-version" id="headerVersion">loading...</span>
</header>

<!-- ═══════════════════ MAIN CONTENT ═══════════════════ -->
<main class="main">

    <!-- STATS HERO ROW -->
    <section id="statsSection">
        <div class="stats-grid" id="statsGrid">
            <!-- Populated by JS -->
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div><span>Loading stats...</span></div></div>
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div></div></div>
            <div class="stat-card"><div class="loading-state"><div class="spinner"></div></div></div>
        </div>
    </section>

    <!-- INSIGHTS TRIPTYCH -->
    <section id="insightsSection">
        <div class="insights-grid" id="insightsGrid">
            <div class="insight-panel"><div class="loading-state"><div class="spinner"></div><span>Loading insights...</span></div></div>
            <div class="insight-panel"><div class="loading-state"><div class="spinner"></div></div></div>
            <div class="insight-panel"><div class="loading-state"><div class="spinner"></div></div></div>
        </div>
    </section>

    <!-- GRAPH EXPLORER -->
    <section class="graph-section" id="graphSection">
        <div class="section-header">
            <span class="section-title">Graph Explorer</span>
        </div>
        <button class="graph-toggle-btn" id="graphToggle" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            Show top 100 nodes
        </button>
        <div class="graph-container" id="graphContainer">
            <div class="graph-canvas-wrap" id="graphCanvasWrap">
                <canvas id="graphCanvas"></canvas>
                <div class="graph-tooltip" id="graphTooltip">
                    <div class="graph-tooltip-name" id="tooltipName"></div>
                    <div class="graph-tooltip-meta" id="tooltipMeta"></div>
                </div>
            </div>
            <div class="graph-legend">
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--blue)"></span> Function</div>
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--purple)"></span> Class</div>
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--green)"></span> Method</div>
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--amber)"></span> Interface</div>
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--text-3)"></span> Other</div>
                <div class="graph-legend-item"><span class="graph-legend-dot" style="background:var(--red)"></span> Dead Code</div>
            </div>
        </div>
    </section>

    <!-- DEAD CODE TABLE -->
    <section class="dead-code-section" id="deadCodeSection">
        <div class="section-header">
            <span class="section-title">Dead Code</span>
            <span class="section-badge section-badge--red" id="deadCodeCount">0</span>
        </div>
        <div class="dead-search-wrap">
            <span class="dead-search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" class="dead-search" id="deadSearch" placeholder="Filter by name or file...">
        </div>
        <div class="dead-table-wrap">
            <table class="dead-table">
                <thead>
                    <tr>
                        <th data-sort="name">Name <span class="sort-arrow">&#9650;</span></th>
                        <th data-sort="kind">Kind <span class="sort-arrow">&#9650;</span></th>
                        <th data-sort="file">File <span class="sort-arrow">&#9650;</span></th>
                        <th data-sort="line_start">Line <span class="sort-arrow">&#9650;</span></th>
                    </tr>
                </thead>
            </table>
            <div class="dead-table-scroll">
                <table class="dead-table">
                    <tbody id="deadCodeBody">
                        <tr><td colspan="4"><div class="loading-state"><div class="spinner"></div><span>Loading dead code...</span></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<script>
/* ═══════════════════════════════════════════════════════
   Ariadne Command Center — Application Logic
   ═══════════════════════════════════════════════════════ */
(function() {
    'use strict';

    /* ───────── Helpers ───────── */
    function fmt(n) {
        if (n == null) return '0';
        if (typeof n === 'number' && n >= 1000) {
            return n.toLocaleString('en-US');
        }
        return String(n);
    }

    function pct(v) {
        if (v == null) return '0%';
        return (v * 100).toFixed(1) + '%';
    }

    function kindDotClass(kind) {
        var k = (kind || '').toLowerCase();
        if (k === 'function') return 'insight-dot--function';
        if (k === 'class') return 'insight-dot--class';
        if (k === 'method') return 'insight-dot--method';
        if (k === 'interface') return 'insight-dot--interface';
        return 'insight-dot--other';
    }

    function kindBadgeClass(kind) {
        var k = (kind || '').toLowerCase();
        if (k === 'function') return 'kind-badge--function';
        if (k === 'class') return 'kind-badge--class';
        if (k === 'method') return 'kind-badge--method';
        if (k === 'interface') return 'kind-badge--interface';
        return 'kind-badge--other';
    }

    function kindColor(kind, isDead) {
        if (isDead) return '#EF4444';
        var k = (kind || '').toLowerCase();
        if (k === 'function') return '#3B82F6';
        if (k === 'class') return '#A78BFA';
        if (k === 'method') return '#10B981';
        if (k === 'interface') return '#F59E0B';
        return '#475569';
    }

    function truncPath(p, max) {
        if (!p) return '';
        if (p.length <= max) return p;
        return '...' + p.slice(-(max - 3));
    }

    function escHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    /* ═══════════════════ SVG ICON PATHS ═══════════════════ */
    var ICONS = {
        files: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>',
        symbols: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>',
        calls: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
        resolution: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        dead: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        langs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };

    /* ═══════════════════ DATA FETCH ═══════════════════ */
    var dataCache = { stats: null, insights: null, graph: null };

    function fetchAll() {
        return Promise.all([
            fetch('/api/stats').then(function(r) { if (!r.ok) throw new Error('stats ' + r.status); return r.json(); }),
            fetch('/api/graph/insights').then(function(r) { if (!r.ok) throw new Error('insights ' + r.status); return r.json(); }),
            fetch('/api/graph').then(function(r) { if (!r.ok) throw new Error('graph ' + r.status); return r.json(); })
        ]).then(function(results) {
            dataCache.stats = results[0];
            dataCache.insights = results[1];
            dataCache.graph = results[2];
            return dataCache;
        });
    }

    /* ═══════════════════ RENDER: STATS ═══════════════════ */
    function renderStats(stats) {
        var deadPct = stats.symbols > 0 ? ((stats.dead_functions / stats.symbols) * 100).toFixed(1) : '0.0';
        var grid = document.getElementById('statsGrid');

        grid.innerHTML =
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.files + ' Files</div>' +
                '<div class="stat-value">' + fmt(stats.files) + '</div>' +
            '</div>' +
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.symbols + ' Symbols</div>' +
                '<div class="stat-value">' + fmt(stats.symbols) + '</div>' +
            '</div>' +
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.calls + ' Calls</div>' +
                '<div class="stat-value">' + fmt(stats.calls) + '</div>' +
            '</div>' +
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.resolution + ' Resolution</div>' +
                '<div class="stat-value stat-value--green">' + pct(stats.resolution_rate) + '</div>' +
                '<div class="progress-bar-wrap"><div class="progress-bar-fill" id="resBar"></div></div>' +
            '</div>' +
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.dead + ' Dead Functions</div>' +
                '<div class="stat-value stat-value--red">' + fmt(stats.dead_functions) + '</div>' +
                '<div class="stat-sub stat-sub--red">' + deadPct + '% of codebase</div>' +
            '</div>' +
            '<div class="stat-card">' +
                '<div class="stat-label">' + ICONS.langs + ' Languages</div>' +
                '<div class="languages-list">' + escHtml((stats.languages || []).join(', ') || 'None detected') + '</div>' +
            '</div>';

        /* animate resolution bar */
        requestAnimationFrame(function() {
            var bar = document.getElementById('resBar');
            if (bar) bar.style.width = (stats.resolution_rate * 100) + '%';
        });

        /* version display */
        var ver = document.getElementById('headerVersion');
        if (ver) {
            var total = stats.files + stats.symbols + stats.calls;
            ver.textContent = fmt(total) + ' indexed';
        }
    }

    /* ═══════════════════ RENDER: INSIGHTS ═══════════════════ */
    function renderInsights(insights) {
        var grid = document.getElementById('insightsGrid');
        grid.innerHTML = '';

        /* Col 1: Most Connected */
        var col1 = document.createElement('div');
        col1.className = 'insight-panel';
        var mc = (insights.most_connected || []).slice(0, 7);
        var html1 = '<div class="section-header"><span class="section-title">Most Connected</span></div>';
        html1 += '<div class="insight-panel__list">';
        if (mc.length === 0) {
            html1 += '<div class="insight-empty">' + ICONS.check + ' No data available</div>';
        } else {
            for (var i = 0; i < mc.length; i++) {
                var item = mc[i];
                html1 += '<div class="insight-row">' +
                    '<span class="insight-dot ' + kindDotClass(item.kind) + '"></span>' +
                    '<span class="insight-name" title="' + escHtml(item.name) + '">' + escHtml(item.name) + '</span>' +
                    '<span class="insight-badge insight-badge--blue">' + fmt(item.connections) + '</span>' +
                '</div>';
            }
        }
        html1 += '</div>';
        col1.innerHTML = html1;
        grid.appendChild(col1);

        /* Col 2: High Coupling (God Files) */
        var col2 = document.createElement('div');
        col2.className = 'insight-panel';
        var gf = insights.god_files || [];
        var html2 = '<div class="section-header"><span class="section-title">High Coupling (50+ connections)</span></div>';
        html2 += '<div class="insight-panel__list">';
        if (gf.length === 0) {
            html2 += '<div class="insight-empty">' + ICONS.check + ' No highly coupled symbols</div>';
        } else {
            for (var j = 0; j < gf.length; j++) {
                var g = gf[j];
                html2 += '<div class="insight-row">' +
                    '<span class="insight-dot insight-dot--amber"></span>' +
                    '<span class="insight-name" title="' + escHtml(g.name) + '">' + escHtml(g.name) + '</span>' +
                    '<span class="insight-file" title="' + escHtml(g.file) + '">' + escHtml(truncPath(g.file, 30)) + '</span>' +
                    '<span class="insight-badge insight-badge--amber">' + fmt(g.connections) + '</span>' +
                '</div>';
            }
        }
        html2 += '</div>';
        col2.innerHTML = html2;
        grid.appendChild(col2);

        /* Col 3: Circular Dependencies */
        var col3 = document.createElement('div');
        col3.className = 'insight-panel';
        var cd = insights.circular_deps || [];
        var html3 = '<div class="section-header"><span class="section-title">Circular Dependencies</span></div>';
        html3 += '<div class="insight-panel__list">';
        if (cd.length === 0) {
            html3 += '<div class="insight-empty">' + ICONS.check + ' No circular dependencies</div>';
        } else {
            for (var k = 0; k < cd.length; k++) {
                var chain = cd[k];
                html3 += '<div class="insight-chain">';
                for (var m = 0; m < chain.length; m++) {
                    if (m > 0) html3 += '<span class="insight-chain__arrow">&rarr;</span>';
                    html3 += '<span class="insight-chain__node">' + escHtml(chain[m]) + '</span>';
                }
                html3 += '</div>';
            }
        }
        html3 += '</div>';
        col3.innerHTML = html3;
        grid.appendChild(col3);
    }

    /* ═══════════════════ RENDER: DEAD CODE TABLE ═══════════════════ */
    var deadCodeData = [];
    var deadSortKey = 'file';
    var deadSortAsc = true;

    function renderDeadCode(insights) {
        deadCodeData = (insights.dead_code || []).slice(0, 200);
        var countEl = document.getElementById('deadCodeCount');
        countEl.textContent = fmt(insights.dead_code_count || deadCodeData.length);
        sortAndRenderDeadTable();
    }

    function sortAndRenderDeadTable() {
        var filtered = deadCodeData;
        var query = (document.getElementById('deadSearch').value || '').toLowerCase().trim();
        if (query) {
            filtered = deadCodeData.filter(function(d) {
                return (d.name || '').toLowerCase().indexOf(query) !== -1 ||
                       (d.file || '').toLowerCase().indexOf(query) !== -1;
            });
        }

        var sorted = filtered.slice().sort(function(a, b) {
            var va = a[deadSortKey] || '';
            var vb = b[deadSortKey] || '';
            if (deadSortKey === 'line_start') {
                va = Number(va) || 0;
                vb = Number(vb) || 0;
            } else {
                va = String(va).toLowerCase();
                vb = String(vb).toLowerCase();
            }
            if (va < vb) return deadSortAsc ? -1 : 1;
            if (va > vb) return deadSortAsc ? 1 : -1;
            return 0;
        });

        var body = document.getElementById('deadCodeBody');
        if (sorted.length === 0) {
            body.innerHTML = '<tr><td colspan="4"><div class="dead-empty">No dead code found' + (query ? ' matching "' + escHtml(query) + '"' : '') + '</div></td></tr>';
            return;
        }

        var rows = '';
        for (var i = 0; i < sorted.length; i++) {
            var d = sorted[i];
            rows += '<tr>' +
                '<td><span class="dead-name">' + escHtml(d.name) + '</span></td>' +
                '<td><span class="kind-badge ' + kindBadgeClass(d.kind) + '">' + escHtml(d.kind) + '</span></td>' +
                '<td><span class="dead-file" title="' + escHtml(d.file) + '">' + escHtml(d.file) + '</span></td>' +
                '<td><span class="dead-line">' + (d.line_start || '') + '</span></td>' +
            '</tr>';
        }
        body.innerHTML = rows;

        /* update sort header indicators */
        var ths = document.querySelectorAll('.dead-table th[data-sort]');
        for (var j = 0; j < ths.length; j++) {
            var th = ths[j];
            th.classList.toggle('sorted', th.getAttribute('data-sort') === deadSortKey);
            var arrow = th.querySelector('.sort-arrow');
            if (th.getAttribute('data-sort') === deadSortKey) {
                arrow.innerHTML = deadSortAsc ? '&#9650;' : '&#9660;';
            } else {
                arrow.innerHTML = '&#9650;';
            }
        }
    }

    /* sort click handler */
    document.querySelectorAll('.dead-table th[data-sort]').forEach(function(th) {
        th.addEventListener('click', function() {
            var key = th.getAttribute('data-sort');
            if (deadSortKey === key) {
                deadSortAsc = !deadSortAsc;
            } else {
                deadSortKey = key;
                deadSortAsc = true;
            }
            sortAndRenderDeadTable();
        });
    });

    /* search input */
    var deadSearchTimer = null;
    document.getElementById('deadSearch').addEventListener('input', function() {
        clearTimeout(deadSearchTimer);
        deadSearchTimer = setTimeout(sortAndRenderDeadTable, 150);
    });

    /* ═══════════════════ GRAPH EXPLORER (Canvas + D3 force) ═══════════════════ */
    var graphInitialized = false;

    document.getElementById('graphToggle').addEventListener('click', function() {
        var btn = this;
        var container = document.getElementById('graphContainer');
        var visible = container.classList.toggle('visible');
        btn.classList.toggle('expanded', visible);
        btn.innerHTML = (visible
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg> Hide graph'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg> Show top 100 nodes');

        if (visible && !graphInitialized && dataCache.graph) {
            graphInitialized = true;
            initGraph(dataCache.graph);
        }
    });

    function initGraph(graphData) {
        var wrap = document.getElementById('graphCanvasWrap');
        var canvas = document.getElementById('graphCanvas');
        var tooltip = document.getElementById('graphTooltip');
        var tooltipName = document.getElementById('tooltipName');
        var tooltipMeta = document.getElementById('tooltipMeta');

        var rect = wrap.getBoundingClientRect();
        var width = rect.width;
        var height = rect.height;
        var dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        /* select top 100 nodes by degree */
        var allNodes = (graphData.nodes || []).slice();
        allNodes.sort(function(a, b) {
            return (b.in_degree + b.out_degree) - (a.in_degree + a.out_degree);
        });
        var topNodes = allNodes.slice(0, 100);
        var nodeIdSet = {};
        topNodes.forEach(function(n) { nodeIdSet[n.id] = true; });

        var simNodes = topNodes.map(function(n) {
            var deg = (n.in_degree || 0) + (n.out_degree || 0);
            return {
                id: n.id,
                name: n.name,
                kind: n.kind,
                file: n.file,
                in_degree: n.in_degree,
                out_degree: n.out_degree,
                is_dead: n.is_dead,
                radius: Math.max(3, Math.min(18, 3 + Math.log2(1 + deg) * 2.5)),
                color: kindColor(n.kind, n.is_dead)
            };
        });

        var simEdges = (graphData.edges || []).filter(function(e) {
            return nodeIdSet[e.source] && nodeIdSet[e.target];
        }).map(function(e) {
            return { source: e.source, target: e.target, confidence: e.confidence };
        });

        /* D3 force simulation */
        var simulation = d3.forceSimulation(simNodes)
            .force('link', d3.forceLink(simEdges).id(function(d) { return d.id; }).distance(60).strength(0.3))
            .force('charge', d3.forceManyBody().strength(-80).distanceMax(250))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(function(d) { return d.radius + 2; }))
            .alphaDecay(0.02)
            .on('tick', draw);

        function draw() {
            ctx.clearRect(0, 0, width, height);

            /* edges */
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.15;
            ctx.strokeStyle = '#3B82F6';
            ctx.beginPath();
            simEdges.forEach(function(e) {
                if (e.source && e.target && typeof e.source.x === 'number') {
                    ctx.moveTo(e.source.x, e.source.y);
                    ctx.lineTo(e.target.x, e.target.y);
                }
            });
            ctx.stroke();
            ctx.globalAlpha = 1;

            /* nodes */
            simNodes.forEach(function(n) {
                if (typeof n.x !== 'number') return;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = n.color;
                ctx.globalAlpha = 0.85;
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        /* hover tooltip */
        var hoveredNode = null;
        canvas.addEventListener('mousemove', function(evt) {
            var cr = canvas.getBoundingClientRect();
            var mx = evt.clientX - cr.left;
            var my = evt.clientY - cr.top;
            var found = null;
            for (var i = simNodes.length - 1; i >= 0; i--) {
                var n = simNodes[i];
                var dx = mx - n.x;
                var dy = my - n.y;
                if (dx * dx + dy * dy <= (n.radius + 3) * (n.radius + 3)) {
                    found = n;
                    break;
                }
            }
            if (found !== hoveredNode) {
                hoveredNode = found;
                if (found) {
                    tooltipName.textContent = found.name;
                    tooltipMeta.textContent = found.kind + '  |  in:' + (found.in_degree || 0) + '  out:' + (found.out_degree || 0);
                    tooltip.style.display = 'block';
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    canvas.style.cursor = 'default';
                }
            }
            if (found) {
                var tx = mx + 14;
                var ty = my - 10;
                if (tx + 200 > width) tx = mx - 180;
                if (ty < 10) ty = my + 14;
                tooltip.style.left = tx + 'px';
                tooltip.style.top = ty + 'px';
            }
        });

        canvas.addEventListener('mouseleave', function() {
            hoveredNode = null;
            tooltip.style.display = 'none';
            canvas.style.cursor = 'default';
        });

        /* drag behaviour on canvas */
        var dragNode = null;
        canvas.addEventListener('mousedown', function(evt) {
            var cr = canvas.getBoundingClientRect();
            var mx = evt.clientX - cr.left;
            var my = evt.clientY - cr.top;
            for (var i = simNodes.length - 1; i >= 0; i--) {
                var n = simNodes[i];
                var dx = mx - n.x;
                var dy = my - n.y;
                if (dx * dx + dy * dy <= (n.radius + 3) * (n.radius + 3)) {
                    dragNode = n;
                    n.fx = n.x;
                    n.fy = n.y;
                    simulation.alphaTarget(0.3).restart();
                    break;
                }
            }
        });
        window.addEventListener('mousemove', function(evt) {
            if (!dragNode) return;
            var cr = canvas.getBoundingClientRect();
            dragNode.fx = evt.clientX - cr.left;
            dragNode.fy = evt.clientY - cr.top;
        });
        window.addEventListener('mouseup', function() {
            if (dragNode) {
                dragNode.fx = null;
                dragNode.fy = null;
                dragNode = null;
                simulation.alphaTarget(0);
            }
        });

        /* handle resize */
        var resizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                var r = wrap.getBoundingClientRect();
                width = r.width;
                height = r.height;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            }, 200);
        });
    }

    /* ═══════════════════ ERROR DISPLAY ═══════════════════ */
    function showError(containerId, message) {
        var el = document.getElementById(containerId);
        if (el) {
            el.innerHTML = '<div class="error-state">' + ICONS.alert + ' <span>' + escHtml(message) + '</span></div>';
        }
    }

    /* ═══════════════════ INIT ═══════════════════ */
    fetchAll().then(function(data) {
        renderStats(data.stats);
        renderInsights(data.insights);
        renderDeadCode(data.insights);
    }).catch(function(err) {
        console.error('Ariadne Command Center: fetch error', err);
        showError('statsGrid', 'Failed to load data. Is the Ariadne server running?');
        showError('insightsGrid', 'Failed to load insights: ' + (err.message || err));
        document.getElementById('deadCodeBody').innerHTML =
            '<tr><td colspan="4"><div class="error-state">' + ICONS.alert + ' <span>Could not load dead code data</span></div></td></tr>';
    });

})();
</script>
</body>
</html>
