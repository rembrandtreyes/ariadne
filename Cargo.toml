[package]
name = "ariadne"
version = "0.1.0"
edition = "2021"
description = "The thread through the labyrinth — universal dependency graph for AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loremllc/ariadne"
categories = ["development-tools", "command-line-utilities"]
keywords = ["dependency-graph", "mcp", "static-analysis", "code-intelligence"]

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
# MCP server
# SECURITY: transport-sse-server intentionally excluded — SSE/HTTP transport would expose
# all MCP tools over the network without authentication. Only stdio transport is safe.
rmcp = { version = "0.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }

# Parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Graph
petgraph = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# Dashboard
axum = "0.8"
rust-embed = "8"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Schema reading
openapiv3 = "2"
serde_yaml = "0.9"

# File watching
notify = { version = "7", optional = true }

# LSP server
tower-lsp = { version = "0.20", optional = true }

# WASM plugin runtime
wasmtime = { version = "42", optional = true, features = ["component-model"] }

# Utilities
rayon = "1.10"
walkdir = "2"
globset = "0.4"
git2 = "0.20"
strsim = "0.11"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["watch", "lsp"]
watch = ["dep:notify"]
lsp = ["dep:tower-lsp"]
plugins = ["dep:wasmtime"]
full = ["watch", "lsp"]

[dev-dependencies]
tempfile = "3"
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
